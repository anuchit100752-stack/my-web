<!DOCTYPE html>
<html>
<head>
    <title>อิโมจิเยอะๆ ลอยไปมา</title>
    <style>
        body {
            background-color: lightblue; /* พื้นหลังสีฟ้า */
            margin: 0;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        h1 {
            text-align: center;
            color: navy;
            margin-top: 20px;
            font-family: Arial, sans-serif;
            position: relative;
            z-index: 10;
        }

        img {
            display: block;
            margin: 20px auto;
            width: 400px;
            border: 3px solid navy;
            border-radius: 10px;
            position: relative;
            z-index: 10;
        }

        .emoji {
            position: absolute;
            font-size: 2rem;
            opacity: 0.8;
            animation: float 10s infinite alternate ease-in-out;
        }

        @keyframes float {
            0%   { transform: translate(0, 0) rotate(0deg); }
            50%  { transform: translate(100px, -150px) rotate(20deg); }
            100% { transform: translate(-80px, 120px) rotate(-20deg); }
        }
    </style>
</head>
<body>
    <h1>จบแล้วนะคับทุกคน</h1>

    <!-- รูป -->
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSKIZ8c10-SFchuFd7-e5HF1H1SmJ5gQc29vg&s">

    <script>
        const emojis = ["📸","🦑","😎"];
        const container = document.body;

        for (let i = 0; i < 50; i++) { // จำนวนอิโมจิ 50 ตัว
            const div = document.createElement("div");
            div.className = "emoji";
            div.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            div.style.top = Math.random() * 100 + "%";
            div.style.left = Math.random() * 100 + "%";
            div.style.animationDuration = (8 + Math.random() * 10) + "s";
            div.style.fontSize = (1.5 + Math.random() * 2.5) + "rem";
            container.appendChild(div);
        }
    </script>
</body>
</html>
